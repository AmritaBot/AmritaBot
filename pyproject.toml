[project]
name = "amrita"
version = "1.10.2"
description = "A powerful Agent bot powered by NoneBot2"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10, <3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.13.2",
    "aiologic>=0.16.0",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.4",
    "amrita-core>=1.2.0,<2.0.0",
    "amrita-sense>=1.0.0,<2.0.0",
    "amctl>=0.1.5",
    "async-lru>=2.0.5",
    "bcrypt>=4.3.0",
    "faskill[amrita]>=0.3.0",
    "importlib>=1.0.4",
    "jinja2>=3.1.6",
    "nb-cli>=1.6.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-amrita>=0.4.0",
    "nonebot-plugin-orm>=0.8.3",     # See https://github.com/nonebot/plugin-orm/issues/33
    "nonebot-plugin-uniconf>=0.1.3",
    "nonebot2[fastapi]>=2.4.3",
    "packaging>=23.0",
    "pillow>=12.0.0",
    "psutil>=7.0.0",
    "pydantic>=2.4.2",
    "python-multipart>=0.0.20",
    "pytz>=2025.2",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "tomlkit>=0.12.0",
    "typing-extensions>=4.6.0",
    "watchfiles>=1.1.1",
    "zipp>=3.23.0",
]
[project.scripts]
amrita = "amrita.__main__:main"

[project.urls]
"Homepage" = "https://github.com/AmritaBot/AmritaBot"
"Source" = "https://github.com/AmritaBot/AmritaBot"
"Issue Tracker" = "https://github.com/AmritaBot/AmritaBot/issues"

[tool.setuptools.packages.find]
include = ["amrita", "amrita.*"]

# 添加资源文件包含配置
[tool.setuptools.package-data]
# templates 已随 Jinja2 SSR 重构移除，仅保留 static 构建产物
"amrita.plugins.webui.service" = ["static/**/*", "*.json"]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "nonebot-plugin-orm[default]>=0.8.2",
    "pytest>=8.4.1",
    "py-spy>=0.4.1",
    "pyright>=1.1.407",
    "ambot-inlinectl>=0.1.2",
]


[tool.uv]
package = true

[tool.uv.sources]
amrita = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py310"
# website/ 是 amrita-docs 文档站子模块，不参与本仓库的 lint
extend-exclude = ["website"]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "T10",   # flake8-debugger
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RUF",   # Ruff-specific rules
    "I",     # isort
    "PERF",  # pylint-performance
]
ignore = [
    "E402",   # module-import-not-at-top-of-file
    "E501",   # line-too-long
    "UP037",  # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.amrita]
plugins = [
    "amrita.plugins.chat",
    "amrita.plugins.manager",
    "amrita.plugins.webui",
]

[tool.nonebot]
plugins = ["nonebot_plugin_amrita", "nonebot_plugin_orm"]
[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [{ root = ".", pythonVersion = "3.10" }]
# website/ 是 amrita-docs 文档站子模块，不参与本仓库的类型检查
exclude = ["website"]
