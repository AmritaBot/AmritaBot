{%extends base_html%} {% block title %}Chat模块信息仪表盘{% endblock %} {% block
topbar_title %}Chat信息仪表盘{% endblock %}
{% block content %}
<div class="max-w-[1200px] mx-auto">
  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
    <div class="glass-card p-5 flex items-center transition-transform hover:-translate-y-1 hover:shadow-lg">
      <div class="w-[50px] h-[50px] rounded-lg flex items-center justify-center mr-4 text-2xl bg-green-500/10 text-green-500 flex-shrink-0">
        <i class="fas fa-arrow-down"></i>
      </div>
      <div>
        <h3 class="text-2xl font-bold dark:text-gray-100">{{ token_prompt }}</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400">今日Tokens输入</p>
      </div>
    </div>
    <div class="glass-card p-5 flex items-center transition-transform hover:-translate-y-1 hover:shadow-lg">
      <div class="w-[50px] h-[50px] rounded-lg flex items-center justify-center mr-4 text-2xl bg-orange-500/10 text-orange-500 flex-shrink-0">
        <i class="fas fa-rocket"></i>
      </div>
      <div>
        <h3 class="text-2xl font-bold dark:text-gray-100">{{ token_completion }}</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400">今日Tokens输出</p>
      </div>
    </div>
    <div class="glass-card p-5 flex items-center transition-transform hover:-translate-y-1 hover:shadow-lg">
      <div class="w-[50px] h-[50px] rounded-lg flex items-center justify-center mr-4 text-2xl bg-blue-500/10 text-primary flex-shrink-0">
        <i class="fas fa-calculator"></i>
      </div>
      <div>
        <h3 class="text-2xl font-bold dark:text-gray-100">{{ usage_count }}</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400">今日调用次数</p>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="glass-card p-5">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-lg font-semibold dark:text-gray-100">Token输入统计</h3>
      </div>
      <div class="h-[300px] bg-gray-50/50 dark:bg-gray-800/50 rounded-lg border border-black/5 dark:border-white/5 p-2">
        <canvas id="inputChart" class="chart-canvas"></canvas>
      </div>
    </div>
    <div class="glass-card p-5">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-lg font-semibold dark:text-gray-100">Token输出统计</h3>
      </div>
      <div class="h-[300px] bg-gray-50/50 dark:bg-gray-800/50 rounded-lg border border-black/5 dark:border-white/5 p-2">
        <canvas id="outputChart" class="chart-canvas"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %} {%block scripts%}
<script>
  const CHART_DATA_JSON = `{{ chart_data | tojson }}`;
  const CHART_DATA = JSON.parse(CHART_DATA_JSON);
  document.addEventListener("DOMContentLoaded", function () {
    initCharts();
  });

  function initCharts() {
    const inputCtx = document.getElementById("inputChart").getContext("2d");
    let inputLabels = [];
    let inputData = [];
    CHART_DATA.forEach(function (item) {
      inputLabels.push(item.date);
      inputData.push(item.token_input);
    });
    const inputChart = new Chart(inputCtx, {
      type: "line",
      data: {
        labels: inputLabels,
        datasets: [
          {
            label: "Tokens",
            data: inputData,
            borderColor: "rgba(49, 80, 214, 1)",
            backgroundColor: "rgba(138, 43, 226, 0.2)",
            tension: 0.1,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });

    const outputCtx = document.getElementById("outputChart").getContext("2d");
    let outputLabels = [];
    let outputData = [];
    CHART_DATA.forEach(function (item) {
      outputLabels.push(item.date);
      outputData.push(item.token_output);
    });
    messagesChart = new Chart(outputCtx, {
      type: "line",
      data: {
        labels: outputLabels,
        datasets: [
          {
            label: "Tokens",
            data: outputData,
            borderColor: "rgba(49, 80, 214, 1)",
            backgroundColor: "rgba(138, 43, 226, 0.2)",
            tension: 0.1,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });
  }
</script>
{%endblock%}
