{% extends "base.html" %} {% block title %} 权限组权限 - Amrita Dashboard{%
endblock %} {% block topbar_title %}权限组权限详情{% endblock %} {% block
content %}
<div class="glass-card p-5">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-semibold dark:text-gray-100">权限组权限详情</h2>
  </div>
  <div class="">
    <div class="mb-3">
      <h4>权限组名称: {{ group_name }}</h4>
    </div>
    <div class="glass-card p-5 mt-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold dark:text-gray-100">权限组权限</h3>
        <button
          type="button"
          class="px-4 py-2 rounded text-sm font-medium bg-success text-white hover:bg-green-700"
          id="add-permission"
        >
          <i class="fas fa-plus"></i> 添加权限
        </button>
      </div>
      <div class="">
        <form id="perm-group-permissions-form">
          <div class="mb-4">
            <div id="permissions-container" class="mb-3"></div>
            <input
              type="hidden"
              id="permissions-data"
              name="permissions"
              value=""
            />
            <div class="flex gap-2">
              <button
                type="submit"
                class="px-4 py-2 rounded text-sm font-medium bg-primary text-white hover:bg-primary-hover"
              >
                <i class="fas fa-save"></i> 保存权限
              </button>
              <a
                href="/users/permissions"
                class="px-4 py-2 rounded text-sm font-medium bg-gray-500 text-white hover:bg-gray-600"
              >
                <i class="fas fa-arrow-left"></i> 返回
              </a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  const permissionsDataStr = `{{ permissions }}`;

  function addPermissionEntry(key = "", value = "true") {
    const container = document.getElementById("permissions-container");
    const entryId = "perm-" + Date.now();

    const entryDiv = document.createElement("div");
    entryDiv.className =
      "permission-entry flex flex-col gap-2 mb-3 p-2 rounded bg-gray-50 dark:bg-gray-800";
    entryDiv.id = entryId;

    entryDiv.innerHTML = `
      <div>
        <input type="text" class="input-glass mb-2" placeholder="权限节点（如 a.*）" value="${key}">
        <select class="input-glass mb-2">
          <option value="true" ${
            value === "true" ? "selected" : ""
          }>持有</option>
          <option value="false" ${
            value === "false" ? "selected" : ""
          }>不持有</option>
        </select>
        <button type="button" class="w-full px-3 py-1 rounded text-sm bg-danger text-white hover:bg-red-700 remove-permission">
          <i class="fas fa-trash"></i> 删除
        </button>
      </div>
    `;

    container.appendChild(entryDiv);

    entryDiv
      .querySelector(".remove-permission")
      .addEventListener("click", function () {
        container.removeChild(entryDiv);
      });
  }

  document.addEventListener("DOMContentLoaded", function () {
    const permissionsLines = permissionsDataStr.split("\n");
    for (const line of permissionsLines) {
      if (line.trim() !== "") {
        const parts = line.trim().split(" ");
        if (parts.length >= 2) {
          const key = parts.slice(0, -1).join(" ");
          const value = parts[parts.length - 1];
          addPermissionEntry(key, value);
        }
      }
    }

    if (permissionsLines.length <= 1 && permissionsLines[0].trim() === "") {
      addPermissionEntry();
    }

    document
      .getElementById("add-permission")
      .addEventListener("click", function () {
        addPermissionEntry();
      });

    document
      .getElementById("perm-group-permissions-form")
      .addEventListener("submit", function (e) {
        e.preventDefault();

        let permissions = "";
        const entries = document.querySelectorAll(".permission-entry");

        entries.forEach(function (entry) {
          const keyInput = entry.querySelector(".permission-key");
          const valueSelect = entry.querySelector(".permission-value");

          const key = keyInput.value.trim();
          const value = valueSelect.value;

          if (key) {
            permissions += `${key} ${value}\n`;
          }
        });

        document.getElementById("permissions-data").value = permissions;

        const formData = new FormData(this);

        fetch(`/api/users/permissions/perm_group/{{ group_name }}`, {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              Swal.fire("成功", data.message, "success");
            } else {
              Swal.fire("错误", data.message, "error");
            }
          })
          .catch((error) => {
            Swal.fire("错误", "保存失败: " + error.message, "error");
          });
      });
  });
</script>
<!-- Tailwind: styles migrated to dist.css -->
{% endblock %}
