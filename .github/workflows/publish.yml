name: Publish to PyPI on Release

on:
  release:
    types: [created]  # 当有新Release创建时触发

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Download Tailwind CSS CLI
        run: |
          curl -sLo tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.19/tailwindcss-linux-x64
          chmod +x tailwindcss

      - name: Build Tailwind CSS
        run: |
          ./tailwindcss -i amrita/plugins/webui/service/static/css/tailwind.css -o amrita/plugins/webui/service/static/css/dist.css --minify

      - name: Publish to PyPI
        run: |
          uv build
          uv publish --token ${{ secrets.PYPI_API_TOKEN }}